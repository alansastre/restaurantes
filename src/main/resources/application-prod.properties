# Perfil PROD: PostgreSQL 18 (se levanta con docker compose, ver compose.yaml).
# Activar con:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
#               (o variable de entorno SPRING_PROFILES_ACTIVE=prod)
#
# NOTA (datos demo): DataInitializer siembra al arrancar, PERO con guarda de idempotencia
# ('if (restaurantRepo.count() > 0) return;'), asi que un 2o arranque NO duplica los datos.
# Para empezar de cero:   docker compose down -v   &&   docker compose up -d
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:restaurantes}
spring.datasource.username=${POSTGRES_USER:restaurantes}
spring.datasource.password=${POSTGRES_PASSWORD:restaurantes}
spring.datasource.driver-class-name=org.postgresql.Driver

# update: Hibernate crea/actualiza el esquema y los datos persisten entre arranques
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# La consola H2 no aplica con PostgreSQL
spring.h2.console.enabled=false
